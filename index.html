<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-5">

    <div class="box">

        <h1>Student Results</h1>

        <p>Manage students and calculate mercy marks</p>

        <input id="studentName" class="form-control mb-3" placeholder="Student Name">

        <div class="row mb-3">

            <div class="col"><input id="grade1" type="number" class="form-control" placeholder="Grade 1"></div>

            <div class="col"><input id="grade2" type="number" class="form-control" placeholder="Grade 2"></div>

            <div class="col"><input id="grade3" type="number" class="form-control" placeholder="Grade 3"></div>

        </div>

        <input id="attendance" type="number" class="form-control mb-3" placeholder="Attendance">

        <div id="errorBox" class="text-danger mb-2"></div>

        <button id="addStudentBtn" class="btn btn-primary w-100 mb-2">Add Student</button>

        <button id="committeeBtn" class="btn btn-success w-100">Mercy Committee</button>

        <hr>

        <h4>Students List</h4>

        <div id="studentsDisplay"></div>

        <hr>

        <h4>Final Report</h4>

        <div id="reportDisplay"></div>

    </div>

</div>

<script src="js/main.js"></script>

<script src="js/app.js"></script>

</body>

</html>
